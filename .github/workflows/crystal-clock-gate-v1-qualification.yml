name: Crystal Clock Gate V1 Qualification

on:
  push:
    branches:
      - crystal-clock-gate-v1-qualification
    paths:
      - ".github/workflows/crystal-clock-gate-v1-qualification.yml"
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Clone exact Fishtest candidate branch
        run: |
          set -euo pipefail
          git clone --filter=blob:none --branch crystal-clock-gate-v1 https://github.com/metalogiclabs/Stockfish.git /tmp/candidate
          test "$(git -C /tmp/candidate rev-parse HEAD)" = "63351ab226b9418ba5046cdd0d7e6ac469327a18"
          git -C /tmp/candidate diff 0a215d6c9e48856ef630013b8ab8312941a59057..HEAD -- src/search.cpp > /tmp/candidate.patch
          echo "7ee31f9f8fc69589be85358af7d9e0e736ee20c55704e8f344ff4bae93a35c98  /tmp/candidate.patch" | sha256sum -c -
          grep -F 'if (mainThread->tm.optimum() <= 64)' /tmp/candidate/src/search.cpp
          grep -F 'highBestMoveEffort = 1.0;' /tmp/candidate/src/search.cpp

      - name: Build exact candidate
        run: |
          set -euo pipefail
          make -C /tmp/candidate/src -j2 build ARCH=x86-64

      - name: Bench exact candidate
        run: |
          set -euo pipefail
          mkdir -p evidence
          /tmp/candidate/src/stockfish bench 16 1 13 default depth 2>&1 | tee evidence/bench.txt
          echo "candidate_commit=63351ab226b9418ba5046cdd0d7e6ac469327a18" > evidence/manifest.txt
          echo "base_commit=0a215d6c9e48856ef630013b8ab8312941a59057" >> evidence/manifest.txt
          echo "diff_sha256=7ee31f9f8fc69589be85358af7d9e0e736ee20c55704e8f344ff4bae93a35c98" >> evidence/manifest.txt
          echo "CRYSTAL_CLOCK_GATE_V1_QUALIFICATION=PASS"

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: crystal-clock-gate-v1-qualification
          path: evidence/
          if-no-files-found: error
